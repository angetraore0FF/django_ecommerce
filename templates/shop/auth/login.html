<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Connexion - KaderShop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --gray-light: #f5f5f5;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--white);
            color: var(--black);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .login-container {
            max-width: 450px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .card {
            border: 2px solid var(--black);
            border-radius: 0;
            box-shadow: 8px 8px 0 var(--black);
        }
        
        .card-body {
            padding: 3rem;
        }
        
        h2 {
            font-weight: 600;
            margin-bottom: 2rem;
        }
        
        .form-control {
            border: 1px solid var(--black);
            border-radius: 0;
            padding: 0.75rem;
            font-size: 1rem;
        }
        
        .form-control:focus {
            border-color: var(--black);
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.1);
        }
        
        .form-label {
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        
        .btn {
            border-radius: 0;
            padding: 0.75rem;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background-color: var(--black);
            border: 2px solid var(--black);
            color: var(--white);
        }
        
        .btn-primary:hover {
            background-color: var(--white);
            color: var(--black);
            transform: translateY(-2px);
        }
        
        .alert {
            border: 2px solid var(--black);
            border-radius: 0;
            background-color: var(--gray-light);
        }
        
        .text-center a {
            color: var(--black);
            text-decoration: none;
            border-bottom: 1px solid var(--black);
            transition: opacity 0.2s;
        }
        
        .text-center a:hover {
            opacity: 0.7;
        }
        
        .logo {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="logo">
                <i class="fas fa-store"></i> KaderShop
            </div>
            
            <div class="card">
                <div class="card-body">
                    <h2 class="text-center">Connexion</h2>
                    
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="username" class="form-control" placeholder="votre@email.com" required>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Mot de passe</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 mb-3">
                            <i class="fas fa-sign-in-alt"></i> Se connecter
                        </button>
                    </form>
                    
                    <div class="text-center">
                        <a href="{% url 'shop:register' %}">Créer un compte</a>
                        <span class="mx-2">|</span>
                        <a href="{% url 'shop:product_list' %}">Retour à la boutique</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
